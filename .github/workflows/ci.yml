name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-only
            samples: "OFF"
            tests: "OFF"
            sanitizer_flags: ""
            use_mimalloc: "ON"
            run_tests: false
          - name: full
            samples: "ON"
            tests: "ON"
            sanitizer_flags: ""
            use_mimalloc: "ON"
            run_tests: true
          - name: sanitizers
            samples: "ON"
            tests: "ON"
            sanitizer_flags: "-fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
            use_mimalloc: "ON"
            run_tests: true
          - name: thread-sanitizer
            samples: "ON"
            tests: "ON"
            sanitizer_flags: "-fsanitize=thread -fno-omit-frame-pointer"
            # mimalloc has known, longstanding ThreadSanitizer-only data races
            # in its own lazy per-thread heap init (microsoft/mimalloc#130,
            # #1230) - unrelated to this repo, but it drowns out any real race
            # in nats_tool's own code since TSan halts on the first one seen.
            use_mimalloc: "OFF"
            run_tests: true

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: f87344cac03158cbf1467264565f1fd36b382a24

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_OVERLAY_TRIPLETS=${GITHUB_WORKSPACE}/triplets
          -DNATS_ASIO_BUILD_SAMPLES=${{ matrix.samples }}
          -DNATS_ASIO_BUILD_TESTS=${{ matrix.tests }}
          -DNATS_ASIO_INSTALL=ON
          -DNATS_ASIO_USE_MIMALLOC=${{ matrix.use_mimalloc }}
          -DCMAKE_CXX_FLAGS="${{ matrix.sanitizer_flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.sanitizer_flags }}"

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Test core-only installed consumer
        if: matrix.name == 'core-only'
        run: >-
          cmake
          -DPROJECT_BUILD_DIR=${GITHUB_WORKSPACE}/build-ci
          -DCONSUMER_SOURCE_DIR=${GITHUB_WORKSPACE}/tests/install_consumer
          -DTEST_ROOT=${GITHUB_WORKSPACE}/build-ci/core-consumer-test
          -DDEPENDENCY_PREFIX=${GITHUB_WORKSPACE}/build-ci/vcpkg_installed/x64-linux
          -DINSTALL_CMAKE_DIR=lib/cmake/nats_asio
          -P ${GITHUB_WORKSPACE}/tests/run_installed_consumer.cmake

      - name: Test
        if: matrix.run_tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-ci --output-on-failure -LE integration

      # "integration"-labeled tests (nats_tool_integration, live_server_regression)
      # need a real nats-server - JetStream/KV behavior isn't worth faking the
      # way the unit tests above do. Runs under the sanitizer builds too - the
      # previous version of this file didn't even build nats_tool for the
      # sanitizer entries, so ASan/TSan never saw its code paths at all (that's
      # exactly the gap that let a real nak() use-after-free ship undetected
      # until it was found by hand). New and informational for now: doesn't
      # block CI on failure.
      - name: Start NATS server for integration tests
        if: matrix.tests == 'ON'
        run: |
          docker run -d --name nats-integration -p 4222:4222 -p 8222:8222 nats:latest -js -m 8222
          timeout 30 bash -c 'until curl -sf http://localhost:8222/varz > /dev/null; do sleep 1; done'

      - name: Integration tests (informational)
        if: matrix.tests == 'ON'
        continue-on-error: true
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-ci --output-on-failure -L integration

  gcc-versions:
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: 13
            image: gcc:13-bookworm
          - gcc: 14
            image: gcc:14-bookworm
          - gcc: 15
            image: gcc:15-bookworm
          - gcc: 16
            image: gcc:16.1-trixie

    name: gcc-${{ matrix.gcc }}

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: >-
          apt-get update && apt-get install -y
          ca-certificates cmake curl git ninja-build perl pkg-config tar unzip zip

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgGitCommitId: f87344cac03158cbf1467264565f1fd36b382a24

      - name: Configure
        run: >-
          cmake -S . -B build-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_OVERLAY_TRIPLETS=${GITHUB_WORKSPACE}/triplets
          -DNATS_ASIO_BUILD_SAMPLES=OFF
          -DNATS_ASIO_BUILD_TESTS=ON
          -DNATS_ASIO_INSTALL=ON

      - name: Build
        run: cmake --build build-gcc --parallel 2

      - name: Test
        run: ctest --test-dir build-gcc --output-on-failure
